version: 2
updates:
  # Actions used by .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  # Base images for the CI-built image (Dockerfile) and the devcontainer
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly

  # Python packages installed in both images. Unpinned requirements are skipped,
  # so pin a version (e.g. websockets==X.Y) for Dependabot to track it.
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
