name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  REGISTRY_IMAGE: ghcr.io/huskyroboticsteam/overhaul-comms

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .devcontainer/requirements.txt
            .github/requirements-ci.txt
            src/mc_bridge/setup.py
            src/rover_safety/setup.py
            protocol/packet.schema.json

      - name: Install dependencies
        run: >-
          python -m pip install
          --requirement .devcontainer/requirements.txt
          --requirement .github/requirements-ci.txt
          --editable src/mc_bridge
          --editable src/rover_safety

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint Python
        run: |
          python -m flake8 \
            scripts/zenoh_integration_test.py \
            src/mc_bridge/mc_bridge \
            src/mc_bridge/test \
            src/mc_bridge/setup.py \
            src/rover_safety/rover_safety \
            src/rover_safety/test \
            src/rover_safety/setup.py
          python -m pydocstyle \
            scripts/zenoh_integration_test.py \
            src/mc_bridge/mc_bridge \
            src/mc_bridge/test \
            src/mc_bridge/setup.py \
            src/rover_safety/rover_safety \
            src/rover_safety/test \
            src/rover_safety/setup.py

      - name: Type-check transport-independent code
        run: |
          python -m mypy --strict --ignore-missing-imports \
            src/mc_bridge/mc_bridge/packet.py \
            src/mc_bridge/mc_bridge/command_session.py \
            src/mc_bridge/mc_bridge/camera_worker.py \
            src/mc_bridge/mc_bridge/session_inbox.py \
            src/mc_bridge/mc_bridge/websocket_server.py \
            src/rover_safety/rover_safety/safety_gate.py
          python -m mypy \
            --strict \
            --ignore-missing-imports \
            --disable-error-code=misc \
            src/mc_bridge/mc_bridge/bridge_node.py \
            src/mc_bridge/mc_bridge/main.py \
            scripts/zenoh_integration_test.py \
            src/rover_safety/rover_safety/watchdog_node.py

      - name: Test transport-independent code
        run: |
          python -m pytest --quiet src/mc_bridge/test \
            --ignore=src/mc_bridge/test/test_flake8.py \
            --ignore=src/mc_bridge/test/test_pep257.py
          python -m pytest --quiet src/rover_safety/test/test_safety_gate.py

      - name: Validate configuration files
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          python -m json.tool protocol/packet.schema.json >/dev/null
          python -m json.tool protocol/fixtures/implemented_packets.json \
            >/dev/null
          python -m json.tool config/zenoh/laptop.json5 >/dev/null
          python -m json.tool config/zenoh/rover.json5 >/dev/null
          python -c "from xml.etree import ElementTree; ElementTree.parse('config/cyclone/laptop.xml'); ElementTree.parse('config/cyclone/rover.xml')"
          bash -n .devcontainer/ros_entrypoint.sh
          bash -n docker/ros_entrypoint.sh
          docker compose --profile integration config --quiet

  ros-jazzy:
    name: ROS 2 Jazzy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    env:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Cyclone DDS
        run: |
          config_path="${PWD}/config/cyclone/laptop.xml"
          [[ -f "${config_path}" ]]
          printf 'CYCLONEDDS_URI=file://%s\n' "${config_path}" >> "${GITHUB_ENV}"

      - name: Install ROS and Python dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            python3-pip \
            ros-jazzy-rmw-cyclonedds-cpp
          if [[ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            rosdep init
          fi
          rosdep update --rosdistro jazzy
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -y
          python3 -m pip install \
            --break-system-packages \
            --requirement .devcontainer/requirements.txt

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --symlink-install \
            --event-handlers console_direct+

      - name: Smoke-test bridge runtime
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          timeout 10s python3 <<'PYTHON'
          import rclpy
          from rclpy.signals import SignalHandlerOptions

          import mc_bridge.main
          from mc_bridge.bridge_node import create_node
          from rover_safety.watchdog_node import RoverWatchdogNode

          rclpy.init(signal_handler_options=SignalHandlerOptions.NO)
          try:
              create_node().destroy_node()
              RoverWatchdogNode().destroy_node()
          finally:
              if rclpy.ok():
                  rclpy.shutdown()
          PYTHON

      - name: Test workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+

      - name: Report and gate test results
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          if [[ -d build ]]; then
            colcon test-result --verbose
          else
            echo 'No test results because the workspace was not built.'
          fi

  devcontainer:
    name: Devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build devcontainer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .devcontainer
          load: true
          push: false
          tags: overhaul-comms-devcontainer:ci
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,mode=max,scope=devcontainer

      - name: Smoke-test devcontainer image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/rosdev/ros2_ws:ro" \
            overhaul-comms-devcontainer:ci \
            timeout 10s python3 -c "import importlib.metadata as metadata, os; from pathlib import Path; import rclpy; assert metadata.version('websockets') == '14.2'; assert os.environ['RMW_IMPLEMENTATION'] == 'rmw_cyclonedds_cpp'; assert Path('/home/rosdev/ros2_ws/config/cyclone/laptop.xml').is_file(); rclpy.init(); node = rclpy.create_node('ci_container_smoke_test'); node.destroy_node(); rclpy.shutdown()"

  production-image:
    name: Production image (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: overhaul-comms:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=production-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.arch }}

      - name: Smoke-test production image
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            overhaul-comms:ci-${{ matrix.arch }} \
            timeout 60s python3 -c "import os, rclpy; from mc_bridge.bridge_node import create_node; from rover_safety.watchdog_node import RoverWatchdogNode; assert os.environ['RMW_IMPLEMENTATION'] == 'rmw_cyclonedds_cpp'; rclpy.init(); bridge = create_node(); watchdog = RoverWatchdogNode(); bridge.destroy_node(); watchdog.destroy_node(); rclpy.shutdown()"

      - name: Export production image
        run: |
          artifact_path="${RUNNER_TEMP}/overhaul-comms-${{ matrix.arch }}-${GITHUB_SHA}.tar"
          docker tag \
            "overhaul-comms:ci-${{ matrix.arch }}" \
            overhaul-comms:local
          docker image save \
            --platform "${{ matrix.platform }}" \
            --output "${artifact_path}" \
            overhaul-comms:local

      - name: Upload production image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/overhaul-comms-${{ matrix.arch }}-${{ github.sha }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 7

  zenoh-integration:
    name: Zenoh integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run isolated DDS graphs through Zenoh
        run: |
          docker compose --profile integration up \
            --build \
            --abort-on-container-exit \
            --exit-code-from integration_test \
            integration_test

      - name: Show integration logs
        if: always()
        run: docker compose --profile integration logs --no-color

      - name: Stop integration services
        if: always()
        run: docker compose --profile integration down --volumes

  publish-image:
    name: Publish production image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - python-quality
      - ros-jazzy
      - devcontainer
      - production-image
      - zenoh-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download amd64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overhaul-comms-amd64-${{ github.sha }}.tar
          path: ${{ runner.temp }}/images

      - name: Download arm64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overhaul-comms-arm64-${{ github.sha }}.tar
          path: ${{ runner.temp }}/images

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Push architecture images
        run: |
          amd64_tag="${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-amd64"
          arm64_tag="${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-arm64"

          docker load \
            --input "${RUNNER_TEMP}/images/overhaul-comms-amd64-${GITHUB_SHA}.tar"
          docker tag overhaul-comms:local "${amd64_tag}"

          docker load \
            --input "${RUNNER_TEMP}/images/overhaul-comms-arm64-${GITHUB_SHA}.tar"
          docker tag overhaul-comms:local "${arm64_tag}"

          docker push "${amd64_tag}"
          docker push "${arm64_tag}"

      - name: Publish multi-platform manifest
        run: |
          manifest_tags=(
            --tag "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
          )
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            manifest_tags+=(--tag "${REGISTRY_IMAGE}:main")
          fi

          docker buildx imagetools create \
            "${manifest_tags[@]}" \
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect \
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
