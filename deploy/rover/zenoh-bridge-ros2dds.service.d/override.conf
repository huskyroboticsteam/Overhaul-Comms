# Override for the zenoh-bridge-ros2dds.service that the apt package installs (disabled by default).
# Install steps are in the README "Rover" section.
[Service]
# Must match the environment of the rover's ROS nodes
Environment=ROS_LOCALHOST_ONLY=1
Environment=ROS_DOMAIN_ID=0
# CycloneDDS needs multicast on loopback when ROS_LOCALHOST_ONLY=1 ('+' runs it as root)
ExecStartPre=+/usr/sbin/ip link set lo multicast on
Restart=always
